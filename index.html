
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ماهدخت | فروشگاه اکسسوری</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff5fa;color:#d82b8e;font-family:Tahoma,Arial,sans-serif}
header{margin:10px auto;max-width:1100px;min-height:132px;border-radius:42px;background:#fce5f0;display:flex;align-items:center;justify-content:space-around;padding:12px;box-shadow:0 4px 15px #e9b4ce66}
.tools{font-size:35px;display:flex;gap:20px;align-items:center}
.brand{text-align:center}
.brand img{width:min(320px,48vw);height:76px;object-fit:contain;display:block}
header p{margin:0;font-size:clamp(11px,2vw,18px);font-weight:bold}
main{max-width:1100px;margin:auto;padding:0 12px 110px}
.hero img,.shipping img{width:100%;display:block;border-radius:34px;box-shadow:0 3px 12px #e9b4ce66}
.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 24px}
.category{border:0;background:none;padding:0;cursor:pointer;overflow:hidden;border-radius:26px}
.category img{width:100%;height:auto;display:block}
.shipping{margin:22px 0}
.services,.bottom{display:grid;background:#fce5f0;border:1px solid #f5c6dc;border-radius:35px;box-shadow:0 3px 12px #e9b4ce55}
.services{grid-template-columns:repeat(4,1fr);margin:18px 0 12px}
.bottom{grid-template-columns:repeat(5,1fr);position:fixed;bottom:8px;left:2%;width:96%;z-index:5}
.services button,.bottom button{background:transparent;border:0;color:#d82b8e;padding:14px 4px;font-weight:bold;font-size:clamp(10px,1.7vw,17px);cursor:pointer}
.services button+button,.bottom button+button{border-right:1px solid #e9a9ca}
.symbol{font-size:30px;display:block;margin-bottom:5px}
#notice{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#d82b8e;color:white;padding:12px 20px;border-radius:24px;display:none;z-index:9;white-space:nowrap}
@media(max-width:600px){
header{min-height:105px;margin:6px 8px}
.tools{font-size:26px;gap:10px}
.categories{gap:8px}
.category{border-radius:20px}
.services{border-radius:25px}
.services button{padding:10px 2px}
.symbol{font-size:24px}
}
</style>
</head>
<body>
<header>
<div class="tools">☰</div>
<div class="brand">
<img src="logo.png" alt="لوگوی ماهدخت">
<p>سفارش آنلاین و حضوری - پرداخت از سایت و دایرکت</p>
</div>
<div class="tools"><span>🛒<sup>۰</sup></span><span>⌕</span></div>
</header>

<main>
<section class="hero">
<img src="hero.png" alt="ماهدخت؛ انتخابی خاص برای زیبایی خاص‌تر">
</section>

<section class="categories">
<button class="category" onclick="showMsg('اکسسوری')"><img src="cat-accessories.png" alt="اکسسوری"></button>
<button class="category" onclick="showMsg('بدلیجات')"><img src="cat-jewelry.png" alt="بدلیجات"></button>
<button class="category" onclick="showMsg('اکسسوری مو')"><img src="cat-hair.png" alt="اکسسوری مو"></button>
<button class="category" onclick="showMsg('پلاک')"><img src="cat-pendant.png" alt="پلاک"></button>
<button class="category" onclick="showMsg('کادویی')"><img src="cat-gift.png" alt="کادویی"></button>
<button class="category" onclick="showMsg('خرازی')"><img src="cat-haberdashery.png" alt="خرازی"></button>
</section>

<section class="shipping">
<img src="shipping.png" alt="ارسال به سراسر کشور با بسته‌بندی شیک و خاص">
</section>

<section class="services">
<button onclick="showMsg('تخفیف ها')"><span class="symbol">🎀</span>تخفیف ها</button>
<button onclick="showMsg('آیتم های جذاب')"><span class="symbol">🎁</span>آیتم های جذاب</button>
<button onclick="showMsg('پرداخت امن')"><span class="symbol">💕</span>پرداخت امن</button>
<button onclick="showMsg('درباره ی ماهدخت')"><span class="symbol">🌙</span>درباره ی ماهدخت</button>
</section>
</main>

<nav class="bottom">
<button onclick="showMsg('آدرس فروشگاه')"><span class="symbol">🎀</span>آدرس فروشگاه</button>
<button onclick="showMsg('دسته‌بندی‌ها')"><span class="symbol">🧸</span>دسته‌بندی‌ها</button>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})"><span class="symbol">🏠</span>خانه</button>
<button onclick="showMsg('علاقه‌مندی‌ها')"><span class="symbol">💗</span>علاقه‌مندی‌ها</button>
<button onclick="showMsg('حساب کاربری')"><span class="symbol">♙</span>حساب کاربری</button>
</nav>

<div id="notice"></div>
<script>
function showMsg(label){
const n=document.getElementById('notice');
n.textContent='بخش «'+label+'» به‌زودی تکمیل می‌شود 💗';
n.style.display='block';
clearTimeout(window.msgTimer);
window.msgTimer=setTimeout(()=>n.style.display='none',2200);
}
</script>
</body>
</html>
